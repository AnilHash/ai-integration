name: Eval Gate

on:
  pull_request:
    branches: [master]

jobs:
  golden-set-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
              curl -s http://localhost:6333/healthz > /dev/null && break
              sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-gemma2:2b

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          for i in $(seq 1 30); do
              curl -s http://localhost:11434/api/tags > /dev/null && break
              sleep 1
          done
          ollama pull gemma2:2b

      - name: Seed Qdrant with golden-set corpus
        run: uv run python -m scripts.load_chunks
      
      - name: Ingest CI corpus into Qdrant
        run: uv run python -m eval.ci_ingest

      - name: Run golden set eval
        timeout-minutes: 45
        env:
          OLLAMA_MODEL: gemma2:2b
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: uv run python -m eval.run_eval
      

      - name: Run behavioral regression tests
        env:
          OLLAMA_MODEL: qwen2.5:1.5b
        run: uv run python -m eval.run_behavioral_tests

        
      - name: Run Recall@5 gate
        run: uv run python -m eval.ci_recall_gate