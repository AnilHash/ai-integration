# .github/workflows/nightly-eval.yml
name: Nightly Deep Eval

on:
  schedule:
    - cron: "0 3 * * *"       # 3am UTC daily (runs on default branch only)
  workflow_dispatch: {}         # allow manual trigger too

jobs:
  deep-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60         # 50 items x (generate + judge) on CPU + model swaps
    env:
      # Job-level so every step sees the same model dir (cache path == serve path)
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-models
      UV_PYTHON: "3.12"         # uv manages Python itself; no setup-python needed

    services:
      qdrant:
        # PIN THIS: use the same tag as your local docker-compose, not :latest
        image: qdrant/qdrant:v1.15.0
        ports:
          - 6333:6333
      postgres:                       # ephemeral -- exists only for this job
        image: postgres:16
        env:
          POSTGRES_PASSWORD: eval_ci
          POSTGRES_DB: eval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Same action + version as the PR workflow. Verify this tag exists on
      # https://github.com/astral-sh/setup-uv/releases and keep both files identical.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "Qdrant never became healthy" && exit 1

      # Embedding model cache (skip if you don't use sentence-transformers)
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ollama-models
          key: ollama-qwen2-5-1-5b-gemma2-2b

      - name: Install Ollama, pull both models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Installer starts a systemd service on :11434 -- stop it so ours owns the port
          sudo systemctl stop ollama || true
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull qwen2.5:1.5b
          ollama pull gemma2:2b
          ollama list

      - name: Ingest CI corpus
        run: uv run python -m eval.ci_ingest

      - name: Run full 50-item 3-tier harness
        env:
          OLLAMA_MODEL: qwen2.5:1.5b
          EVAL_JUDGE_MODEL: gemma2:2b        # distinct from generator
          DATABASE_URL: postgresql://postgres:eval_ci@localhost:5432/eval_ci
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: uv run python -m eval.harness

      # Baseline MUST be a committed file (e.g. eval/baseline.json).
      # The CI Postgres is empty at job start, so it has no "previous run".
      - name: Check for regression against committed baseline
        env:
          DATABASE_URL: postgresql://postgres:eval_ci@localhost:5432/eval_ci
        run: uv run python -m eval.check_regression

      - name: Dump Ollama log on failure
        if: failure()
        run: cat ollama.log || true