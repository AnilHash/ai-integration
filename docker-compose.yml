services:
  postgres:
    image: postgres:16
    container_name: postgres_scorer
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scorer_db
    ports:
      - "5435:5432"
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scorer_db"]
      interval: 5s
      timeout: 5s
      retries: 6
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  postgres_data:
