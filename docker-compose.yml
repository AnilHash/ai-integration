services:
  postgres:
    image: postgres:16
    container_name: postgres_scorer
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scorer_db
    ports:
      - "5435:5435"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
